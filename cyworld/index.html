<!doctype html>
<html lang="ko">
  <head>
    <title>민수호의 미니홈피 :: 사이좋은 사람들, 싸이월드</title>
    <link rel="stylesheet" href="./styles/index.css" />
    <script
      src="https://kit.fontawesome.com/e88a32640e.js"
      crossorigin="anonymous"
    ></script>
    <script src="./index.js"></script>
  </head>
  <body>
    <div class="background">
      <div class="outerbox">
        <div class="wrapper">
          <div class="wrapper__left">
            <div class="wrapper__left__header">
              <div class="today">
                <span class="today__word">TODAY</span>
                <span>0</span>
                <span class="today__word"> | TOTAL</span>
                <span>12345</span>
              </div>
            </div>
            <div class="wrapper__left__body">
              <div class="left__body__header">
                <div class="left__body__header__gray"></div>
                <div class="left__body__header__line"></div>
              </div>
              <div class="left__body__profile">
                <div><i class="fa-regular fa-face-smile"></i>이름</div>
                <div><i class="fa-solid fa-phone"></i>Phone</div>
                <div><i class="fa-solid fa-envelope"></i>E-mail</div>
                <div><i class="fa-solid fa-star"></i>인스타그램</div>
              </div>
              <div class="left__body__footer">
                <div class="left__body__footer__title">오늘의 기분</div>
                <div>
                  <select class="left__body__footer__select">
                    <option selected="true">기쁨😊</option>
                    <option>행복😁</option>
                    <option>슬픔😢</option>
                    <option>분노😬</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
          <div class="wrapper__right">
            <div class="wrapper__right__header">
              <div class="right__header__title">사이좋은 사람들, 싸이월드</div>
              <div class="right__header__setting">사생활보호설정</div>
            </div>
            <div class="wrapper__right__body">
              <iframe id="contentFrame" src="./home.html"></iframe>
            </div>
          </div>
          <!-- 네비게이션 -->
          <div class="navigation">
            <div class="navigation__item" id="menuHome" onclick="menuHome()">
              홈
            </div>
            <div
              class="navigation__item"
              id="menuJukebox"
              onclick="menuJukebox()"
            >
              쥬크박스
            </div>
            <div class="navigation__item" id="menuGame" onclick="menuGame()">
              게임
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
