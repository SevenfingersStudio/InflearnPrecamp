<!doctype html>
<html lang="ko">
  <head>
    <title>Document</title>
    <link href="./styles/jukebox.css" rel="stylesheet" />
  </head>
  <body>
    <div class="wrapper">
      <div class="wrapper__header">
        <div class="wrapper__title">
          <div class="title">추억의 BGM</div>
          <div class="subtitle">TODAY CHOICE</div>
        </div>
         <div class="divideLine"></div>
        <div class="albumWrapper">
          <div class="eachAlbum">
            <img class="imgAlbum" src="./images/jukebox-01.png"></img>
            <div class="textAlbum">Y(Please Tell Me Why)</div>
            <div class="artistAlbum">프리스타일</div>
          </div>
          <div class="eachAlbum">
            <img class="imgAlbum" src="./images/jukebox-02.png"></img>
            <div class="textAlbum">눈의 꽃</div>
            <div class="artistAlbum">박효신</div>
          </div>
          <div class="eachAlbum">
            <img class="imgAlbum" src="./images/jukebox-03.png"></img>
            <div class="textAlbum">사랑했나봐</div>
            <div class="artistAlbum">윤도현</div>
          </div>
        </div>
      </div>
      <div class="wrapper__body">
        <div class="wrapper__title">
          <div class="title">추억의 BGM</div>
          <div class="subtitle">TODAYY CHOICE</div>
        </div>
        <table class="tableAlbum">
          <tr>
            <th class="tableAlbum__checkbox"><input type="checkbox"></th>
            <th class="tableAlbum__number">번호</th>
            <th class="tableAlbum__song">곡명</th>
            <th class="talbeAlbum__artist">아티스트</th>
          </tr>
          <tr>
            <td class="tableAlbum__chceckbox__value"><input type="checkbox"></td>
            <td class="tableAlbum__number__value">1</td>
            <td class="tableAlbum__number__song">눈의 꽃</td>
            <td class="tableAlbum__number__artist">박효신</td>
          </tr>
          <tr>
            <td class="tableAlbum__chceckbox__value"><input type="checkbox"></td>
            <td class="tableAlbum__number__value">2</td>
            <td class="tableAlbum__number__song">사랑스러워</td>
            <td class="tableAlbum__number__artist">김종국</td>
          </tr>
          <tr>
            <td class="tableAlbum__chceckbox__value"><input type="checkbox"></td>
            <td class="tableAlbum__number__value">3</td>
            <td class="tableAlbum__number__song">내사람:Partner For Life</td>
            <td class="tableAlbum__number__artist">SG 워너비</td>
          </tr>
          <tr>
            <td class="tableAlbum__chceckbox__value"><input type="checkbox"></td>
            <td class="tableAlbum__number__value">4</td>
            <td class="tableAlbum__number__song">Love Love Love</td>
            <td class="tableAlbum__number__artist">에픽하이</td>
          </tr>
          <tr>
            <td class="tableAlbum__chceckbox__value"><input type="checkbox"></td>
            <td class="tableAlbum__number__value">5</td>
            <td class="tableAlbum__number__song">애인...있어요</td>
            <td class="tableAlbum__number__artist">이은미</td>
          </tr>
        </table>
      </div>
    </div>
  </body>
</html>
